{% extends "base.html" %}{% block content %}
<section class="hero"><h1>Your trusted online pharmacy</h1><p>Genuine medicines, delivered fast.</p></section>
<div class="grid">
{% for p in products %}
  <div class="card">
    <span class="tag">{{ p.category }}</span>
    <h3>{{ p.name }}</h3>
    <p class="price">₹{{ '%.2f'|format(p.price) }}</p>
    <p class="stock">{{ p.stock }} in stock</p>
    <form method="post" action="/cart/add/{{ p.id }}"><button>Add to cart</button></form>
  </div>
{% endfor %}
</div>
{% endblock %}
