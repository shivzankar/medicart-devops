- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    mode: "0755"

- name: Copy application source and Docker files
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../{{ item }}"
    dest: "{{ app_dir }}/"
  loop: [app, docker, .dockerignore]

- name: Write environment file
  ansible.builtin.copy:
    dest: "{{ app_dir }}/docker/.env"
    mode: "0600"
    content: |
      APP_VERSION={{ app_version | default('1.0.0') }}
      SECRET_KEY={{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}
      LOG_PATH={{ data_dir }}/logs

- name: Build image and start containers (docker compose up)
  ansible.builtin.command:
    cmd: docker compose up -d --build
    chdir: "{{ app_dir }}/docker"
  register: compose
  changed_when: true

- name: Wait for website to respond
  ansible.builtin.uri:
    url: http://localhost/health
    return_content: true
  register: health
  retries: 15
  delay: 4
  until: health.status == 200

- name: Show deployment result
  ansible.builtin.debug:
    msg: "MediCart is LIVE -> http://{{ inventory_hostname }}  | health: {{ health.json.status }}"
